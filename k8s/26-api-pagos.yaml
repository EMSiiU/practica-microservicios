apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pagos
  namespace: tienda-microservicios
  labels:
    app: api-pagos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-pagos
  template:
    metadata:
      labels:
        app: api-pagos
    spec:
      containers:
        - name: api-pagos
          image: api-pagos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8007"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: DATABASE_URL_PAGOS
          readinessProbe:
            tcpSocket:
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8007
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-pagos
  namespace: tienda-microservicios
  labels:
    app: api-pagos
spec:
  type: ClusterIP
  selector:
    app: api-pagos
  ports:
    - name: http
      port: 8007
      targetPort: 8007
