apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-pedidos
  namespace: tienda-microservicios
  labels:
    app: api-pedidos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-pedidos
  template:
    metadata:
      labels:
        app: api-pedidos
    spec:
      containers:
        - name: api-pedidos
          image: api-pedidos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8006
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tienda-secrets
                  key: DATABASE_URL_PEDIDOS
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8006
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-pedidos
  namespace: tienda-microservicios
  labels:
    app: api-pedidos
spec:
  type: ClusterIP
  selector:
    app: api-pedidos
  ports:
    - name: http
      port: 8006
      targetPort: 8006
