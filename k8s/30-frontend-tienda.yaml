apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-tienda
  namespace: tienda-microservicios
  labels:
    app: frontend-tienda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-tienda
  template:
    metadata:
      labels:
        app: frontend-tienda
    spec:
      containers:
        - name: frontend-tienda
          image: frontend-tienda:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4200
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 4200
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-tienda
  namespace: tienda-microservicios
  labels:
    app: frontend-tienda
spec:
  type: LoadBalancer
  selector:
    app: frontend-tienda
  ports:
    - name: http
      port: 4200
      targetPort: 4200
