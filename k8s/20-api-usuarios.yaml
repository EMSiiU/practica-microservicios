apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-usuarios
  namespace: tienda-microservicios
  labels:
    app: api-usuarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-usuarios
  template:
    metadata:
      labels:
        app: api-usuarios
    spec:
      containers:
        - name: api-usuarios
          image: api-usuarios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8001"
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-usuarios
  namespace: tienda-microservicios
  labels:
    app: api-usuarios
spec:
  type: ClusterIP
  selector:
    app: api-usuarios
  ports:
    - name: http
      port: 8001
      targetPort: 8001
