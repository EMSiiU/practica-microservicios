apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-inventario
  namespace: tienda-microservicios
  labels:
    app: api-inventario
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-inventario
  template:
    metadata:
      labels:
        app: api-inventario
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: api-inventario
          image: api-inventario:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8004"
          volumeMounts:
            - name: inventario-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: inventario-data
          persistentVolumeClaim:
            claimName: inventario-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventario-data
  namespace: tienda-microservicios
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api-inventario
  namespace: tienda-microservicios
  labels:
    app: api-inventario
spec:
  type: ClusterIP
  selector:
    app: api-inventario
  ports:
    - name: http
      port: 8004
      targetPort: 8004
