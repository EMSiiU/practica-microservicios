apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-resenas
  namespace: tienda-microservicios
  labels:
    app: api-resenas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-resenas
  template:
    metadata:
      labels:
        app: api-resenas
    spec:
      containers:
        - name: api-resenas
          image: api-resenas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8008"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-resenas
  namespace: tienda-microservicios
  labels:
    app: api-resenas
spec:
  type: ClusterIP
  selector:
    app: api-resenas
  ports:
    - name: http
      port: 8008
      targetPort: 8008
