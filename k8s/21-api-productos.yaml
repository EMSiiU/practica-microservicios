apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-productos
  namespace: tienda-microservicios
  labels:
    app: api-productos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-productos
  template:
    metadata:
      labels:
        app: api-productos
    spec:
      containers:
        - name: api-productos
          image: api-productos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8002"
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-productos
  namespace: tienda-microservicios
  labels:
    app: api-productos
spec:
  type: ClusterIP
  selector:
    app: api-productos
  ports:
    - name: http
      port: 8002
      targetPort: 8002
