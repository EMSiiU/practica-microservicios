apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-envios
  namespace: tienda-microservicios
  labels:
    app: api-envios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-envios
  template:
    metadata:
      labels:
        app: api-envios
    spec:
      containers:
        - name: api-envios
          image: api-envios:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          envFrom:
            - configMapRef:
                name: tienda-config
            - secretRef:
                name: tienda-secrets
          env:
            - name: PORT
              value: "8003"
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-envios
  namespace: tienda-microservicios
  labels:
    app: api-envios
spec:
  type: ClusterIP
  selector:
    app: api-envios
  ports:
    - name: http
      port: 8003
      targetPort: 8003
